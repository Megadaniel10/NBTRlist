<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italian Demonlist - Official Pointercrate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Background Ambient Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="brand-icon"><i class="fas fa-fire-flame-curved"></i></div>
            <div class="brand-text">
                <span class="brand-title">DEMONLIST</span>
                <span class="brand-sub">ITALIAN COMMUNITY</span>
            </div>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" data-target="main-list">
                <i class="fas fa-list-ol"></i> Main List
            </button>
            <button class="nav-btn" data-target="stats-viewer">
                <i class="fas fa-ranking-star"></i> Stats Viewer
            </button>
            <button class="nav-btn" data-target="da-verificare">
                <i class="fas fa-hourglass-half"></i> Da Verificare
            </button>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-btn" title="Cambia Tema">
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
        
        <!-- SECTION 1: MAIN LIST (SPLIT VIEW) -->
        <section id="main-list" class="page-section active">
            <div class="split-layout">
                <!-- Colonna Sinistra: Lista Livelli -->
                <aside class="sidebar-list">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="level-search" placeholder="Cerca un livello o creatore...">
                    </div>
                    <div id="levels-list-container" class="scrollable-list">
                        <!-- Generato da JS -->
                    </div>
                </aside>

                <!-- Colonna Destra: Dettaglio Livello Grande -->
                <div class="detail-pane" id="level-detail-pane">
                    <!-- Generato da JS -->
                </div>
            </div>
        </section>

        <!-- SECTION 2: STATS VIEWER (SPLIT VIEW) -->
        <section id="stats-viewer" class="page-section">
            <div class="split-layout">
                <!-- Colonna Sinistra: Classifica Giocatori -->
                <aside class="sidebar-list">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="player-search" placeholder="Cerca giocatore...">
                    </div>
                    <div id="players-list-container" class="scrollable-list">
                        <!-- Generato da JS -->
                    </div>
                </aside>

                <!-- Colonna Destra: Profilo Giocatore & GD Icon -->
                <div class="detail-pane" id="player-detail-pane">
                    <!-- Generato da JS -->
                </div>
            </div>
        </section>

        <!-- SECTION 3: DA VERIFICARE -->
        <section id="da-verificare" class="page-section">
            <div class="section-banner">
                <h1><i class="fas fa-hammer"></i> Progetti in Verifica</h1>
                <p>I futuri demoni della lista attualmente in fase di verifica e i relativi World Record attuali.</p>
            </div>
            <div id="upcoming-container" class="upcoming-grid">
                <!-- Generato da JS -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
